name: Keep Render Backend Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        run: |
          curl -fsS --retry 2 --max-time 60 \
            "https://claim-what-s-yours-3qh1.onrender.com/api/v1/health"
